[package]
name = "madamoiselle"
version = "0.2.0"
edition = "2024"

[dependencies]
log = "0.4.27"
env_logger = "0.11.8"
thiserror = "2.0"
toml = "0.8.23"
duration-str = "0.17.0"
chrono = "0.4.41"
base64 = "0.22.1"

[dependencies.tokio]
version = "1.45.1"
features = ["full"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.poise]
version = "0.6.1"
features = ["chrono"]

[dependencies.serenity]
version = "0.12.4"
features = ["full"]

[dependencies.figment]
version = "0.10.19"
features = ["toml"]

[dependencies.sqlx]
version = "0.8.6"
features = ["runtime-tokio-rustls", "chrono", "sqlite"]
