[package]
name = "madamoiselle"
version = "0.2.9"
edition = "2024"

[dependencies]
log = "0.4.29"
env_logger = "0.11.10"
thiserror = "2.0"
toml = "1.1.0+spec-1.1.0"
duration-str = "0.21.0"
chrono = "0.4.44"
base64 = "0.22.1"
dashmap = "6.1.0"

[dependencies.tokio]
version = "1.50"
features = ["full"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.figment]
version = "0.10.19"
features = ["toml", "env"]

[dependencies.snafu]
version = "0.9.0"
features = ["futures", "backtrace"]

[dependencies.sqlx]
version = "0.8.6"
features = ["runtime-tokio-rustls", "chrono", "sqlite"]

[dependencies.poise]
git = "https://github.com/serenity-rs/poise"
branch = "serenity-next"
