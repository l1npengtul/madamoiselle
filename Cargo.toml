[package]
name = "madamoiselle"
version = "0.1.1"
edition = "2024"

[dependencies]
redb = "2.4.0"
log = "0.4.27"
env_logger = "0.11.7"
thiserror = "2.0"
toml = "0.8.20"
chrono = "0.4.40"
duration-str = "0.17.0"

[dependencies.tokio]
version = "1.44.1"
features = ["full"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.poise]
version = "0.6.1"
features = ["chrono", "cache"]

[dependencies.serenity]
version = "0.12.4"
features = ["full"]

[dependencies.figment]
version = "0.10.19"
features = ["toml"]
